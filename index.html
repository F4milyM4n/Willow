<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2b1630">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Willow">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-32.png">
<title>Willow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: a calm training partner — short prompts, no hype, numbers she can act on.
   IDEA: the gym whiteboard + log card — today's choice at the top, last time's numbers beside every lift.
   PICTURE: the working app itself; the interval clock is the one big graphic, a ring that drains per phase.
   COLOUR and TYPE: aubergine field, white cards, coral for "go", lilac for "easy"; Barlow Condensed numbers, Barlow text.
   LAYOUT: one column, max 640px, big 56px tap targets, sticky bottom action bar. */
:root{color-scheme:light dark;
--bg:light-dark(#f4f1f6,#140c17);--card:light-dark(#fff,#21152a);--ink:light-dark(#1d1222,#f3ecf6);--mute:light-dark(#6c5d73,#b3a3bb);
--line:light-dark(#e3dbe8,#3a2a44);--field:light-dark(#2b1630,#2b1630);--fieldInk:#fff;
--hot:#ff5a4e;--hotInk:#fff;--calm:light-dark(#d9c8f0,#4b3866);--calmInk:light-dark(#2b1630,#f3ecf6);--mid:light-dark(#ffd8c2,#5c3a33);--ok:light-dark(#1f7a55,#5fd4a0)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3,.num{font-family:"Barlow Condensed",Barlow,sans-serif;font-weight:700;line-height:1.05;margin:0}
h1{font-size:clamp(32px,8vw,44px);text-wrap:balance}h2{font-size:26px}h3{font-size:21px}
header{background:var(--field);color:var(--fieldInk);padding:18px max(5vw,16px) 22px}
header .top{display:flex;justify-content:space-between;align-items:center;gap:8px;max-width:640px;margin:0 auto 14px}
header .wrapH{max-width:640px;margin:0 auto}
header p{margin:6px 0 0;color:#dccde4}
.pill{font-size:13px;white-space:nowrap;padding:4px 10px;border-radius:99px;background:#ffffff1f;color:#efe4f3}
main{max-width:640px;margin:0 auto;padding:18px max(4vw,14px) 120px}
.nav{display:flex;gap:6px}.nav button{background:#ffffff14;color:#fff;border:0;border-radius:10px;padding:8px 12px;font:600 14px Barlow,system-ui,sans-serif;min-height:40px}
.nav button[aria-current=true]{background:#fff;color:#2b1630}
.big{display:grid;gap:12px}
.choice{display:flex;gap:14px;align-items:center;width:100%;text-align:left;border:2px solid transparent;border-radius:18px;padding:18px;min-height:96px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer;box-shadow:0 1px 0 var(--line)}
.choice:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--hot);outline-offset:2px}
.choice b{display:block;font:700 26px "Barlow Condensed",system-ui,sans-serif}.choice span{color:var(--mute);font-size:15px}
.choice .sw{flex:none;width:52px;height:52px;border-radius:14px;display:grid;place-items:center}
.sw svg{width:30px;height:30px}
.t-h .sw{background:var(--hot);color:#fff}.t-s .sw{background:var(--mid);color:var(--ink)}.t-t .sw{background:var(--calm);color:var(--calmInk)}
.card{background:var(--card);border-radius:18px;padding:16px;margin:0 0 14px;box-shadow:0 1px 0 var(--line)}
.muted{color:var(--mute);font-size:15px}.small{font-size:13px;color:var(--mute)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grp{margin:18px 0 6px;font:600 15px Barlow,system-ui,sans-serif;color:var(--mute)}
.ex{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--card);margin-bottom:8px;cursor:pointer;min-height:64px}
.ex[aria-pressed=true]{border-color:var(--hot);background:light-dark(#fff3f1,#3a1c22)}
.ex .box{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;color:#fff}
.ex[aria-pressed=true] .box{background:var(--hot);border-color:var(--hot)}
.ex .nm{font-weight:600}.ex .ln{font-size:13px;color:var(--mute)}
button.btn{border:0;border-radius:14px;min-height:52px;padding:0 20px;font:700 19px "Barlow Condensed",system-ui,sans-serif;letter-spacing:.3px;background:var(--hot);color:var(--hotInk);cursor:pointer}
button.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
button.btn:disabled{opacity:.4}
button.sm{min-height:44px;font-size:17px;padding:0 14px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px max(4vw,14px) calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%)}
.bar .in{max-width:640px;margin:0 auto;display:flex;gap:10px}.bar .btn{flex:1}
.presc{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;margin:8px 0}
.presc .num{font-size:30px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{font-size:13px;padding:3px 9px;border-radius:99px;background:var(--bg);white-space:nowrap}
.sets{display:grid;gap:6px;margin-top:10px}
.set{display:grid;grid-template-columns:44px 1fr minmax(0,1fr) 1fr;gap:6px;align-items:center}
.set label{font-size:13px;color:var(--mute)}
input,select,textarea{font:16px Barlow,system-ui,sans-serif;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:10px;min-height:44px;padding:6px 10px;width:100%}
.chk{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font:700 18px Barlow,system-ui,sans-serif;color:transparent;cursor:pointer}
.chk[aria-pressed=true]{background:var(--ok);border-color:var(--ok);color:#fff}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:6px}
.seg button{min-height:44px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:600 15px Barlow,system-ui,sans-serif;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--field);color:#fff;border-color:var(--field)}
.cal{border-left:4px solid var(--hot);padding:10px 12px;background:var(--bg);border-radius:10px;margin-top:10px}
.cal ol{margin:6px 0 10px;padding-left:20px}.cal li{margin:3px 0}
.proto{display:block;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;cursor:pointer}
.proto[aria-pressed=true]{border-color:var(--hot)}
.proto .r{float:right;font:700 24px "Barlow Condensed",system-ui,sans-serif}
.stepper{display:flex;align-items:center;gap:10px}.stepper button{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:700 22px Barlow,system-ui,sans-serif}
.clock{background:var(--field);color:#fff;border-radius:24px;padding:20px;text-align:center}
.clock.work{background:var(--hot)}.clock.rest{background:#3d5a80}.clock.done{background:var(--ok)}
.ring{position:relative;width:min(72vw,300px);aspect-ratio:1;margin:8px auto}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring .tt{position:absolute;inset:0;display:grid;place-items:center;align-content:center}
.ring .tt .num{font-size:clamp(64px,22vw,104px)}
.combo{font:700 clamp(22px,6vw,30px) "Barlow Condensed",system-ui,sans-serif;min-height:2.2em;margin-top:6px;text-wrap:balance}
.hist{border-bottom:1px solid var(--line);padding:10px 0}
table{width:100%;border-collapse:collapse;font-size:15px}td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}td.n{text-align:right;white-space:nowrap}
.note{font-size:13px;color:var(--mute);margin-top:8px}
.plates{display:flex;align-items:center;gap:2px;margin-top:6px}
.plates .sleeve{width:26px;height:8px;border-radius:3px;background:var(--mute)}
.pl{display:grid;place-items:center;min-width:30px;padding:0 3px;border-radius:5px;background:var(--field);color:#fff;font:700 13px "Barlow Condensed",system-ui,sans-serif}
.tag{font-size:12px;padding:1px 7px;border-radius:99px;background:var(--calm);color:var(--calmInk);white-space:nowrap}.tag.th{background:var(--mid);color:var(--ink)}
.srow{display:flex;flex-direction:column;padding:6px 0;border-bottom:1px solid var(--line)}
details summary{cursor:pointer;min-height:32px;display:flex;align-items:center}
.plan{margin:8px 0 0;padding-left:0;list-style:none}.plan li{padding:7px 0;border-bottom:1px solid var(--line);font-size:15px}.plan li b{display:inline-block;min-width:4.6em}
.cnext{font-size:15px;color:#ffffffd9;min-height:1.5em;margin-top:4px;text-wrap:balance}
.why{margin:6px 0 8px;padding-left:20px}.why li{margin:2px 0}.why li::first-letter{text-transform:uppercase}
.exrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}.exrow.off b{color:var(--mute);text-decoration:line-through}
.exrow .btn.sm{min-height:40px;padding:0 10px;font-size:16px}
.set3{display:grid;grid-template-columns:5.5em 4.5em minmax(0,1fr);gap:6px;align-items:center;margin-top:6px}.set3.four{grid-template-columns:5.5em repeat(3,minmax(0,1fr))}.set3.hd{margin-top:2px}
.seg.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.note2{background:var(--calm);color:var(--calmInk);font-size:15px;padding:12px 14px}
.clock.surge{background:#c2185b}
.body{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px}
.body button{min-height:52px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:500 14px Barlow,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;padding:4px}
.body button b{font-weight:600;font-size:14px}.body button span{font-size:12px;color:var(--mute)}
.body button.lv1{background:var(--mid);border-color:#e0a07c}.body button.lv2{background:#ffd1cc;border-color:var(--hot);color:#3a0d0a}.body button.lv2 span,.body button.lv1 span{color:inherit}
.body.sm button{min-height:44px}.body.sm button[aria-pressed=true]{background:var(--field);color:#fff;border-color:var(--field)}
.tag.pain{background:var(--mid);color:var(--ink)}.tag.pain.hi{background:var(--hot);color:#fff}
.caution{margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--mid);font-size:14px}.caution.hi{background:#ffd1cc;color:#3a0d0a}
.card.inst{border:2px solid var(--hot)}
header{padding-top:calc(18px + env(safe-area-inset-top));padding-left:max(5vw,16px,env(safe-area-inset-left));padding-right:max(5vw,16px,env(safe-area-inset-right))}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="top"><span class="pill" id="sync">On this phone</span><nav class="nav" id="nav"><button data-go="home">Train</button><button data-go="history">History</button><button data-go="settings">Setup</button></nav></div><div class="wrapH" id="head"></div></header>
<main id="app"></main>
<div class="bar" id="bar" hidden><div class="in" id="barIn"></div></div>
<script src="app.js?v=6"></script>
<script>
  if ('serviceWorker' in navigator) {
    // Reload once only for an UPDATE (a worker already controlled this page), never on first install.
    const hadController = !!navigator.serviceWorker.controller;
    let refreshedOnce = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!hadController || refreshedOnce) return;
      // Never yank the page mid-interval: wait until the timer screen is gone.
      const reload = () => { refreshedOnce = true; window.location.reload(); };
      const busy = () => { try { const w = JSON.parse(localStorage.getItem('tt-work-v1')); return w && w.type === 'cond' && w.phase === 'timer'; } catch (e) { return false; } };
      if (!busy()) return reload();
      const iv = setInterval(() => { if (!busy()) { clearInterval(iv); reload(); } }, 5000);
    });
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then((reg) => {
        const check = () => { reg.update().catch(() => {}); };
        document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') check(); });
        setInterval(check, 60 * 60 * 1000);
      }).catch(() => {});
    });
  }
</script>
</body>
</html>
